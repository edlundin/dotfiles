# Catppuccin Mocha (OLED) Theme for Ghostty
# Based on the provided VS Code theme, but using a pure black OLED background.
# Derived from Catppuccin Mocha colors for a soft, dark aesthetic.

name = "catppuccin-mocha-oled"

[colors]
# The primary background is set to pure black for OLED displays.
background = "#000000"
foreground = "#cdd6f4" # Text

# The text cursor color
cursor = "#f5e0dc" # Rosewater

# The color for text in the search input box.
search_text = "#cdd6f4" # Text

# The background color for text matching the search query.
search_match_background = "#89b4fa4d" # Blue with transparency

# The color of the cursor in the search input box.
search_cursor = "#f5e0dc" # Rosewater

# The background color of the selection in the search input box.
search_selection_background = "#a6e3a14d" # Green with transparency

# The color of the text when selected.
selection_text = "#000000" # Black (to ensure contrast over selection background)

# The background color of the selection.
selection_background = "#a6adc84d" # Subtext0 with transparency

# The color for links and URLs.
url_color = "#89b4fa" # Blue

# The color for dim text.
dim_color = "#6c7086" # Overlay0

# The border color when the window is focused.
window_border_focused = "#313244" # Surface0

# The border color when the window is unfocused.
window_border_unfocused = "#11111b" # Crust

# The background color of tabs.
tab_background = "#181825" # Mantle

# The foreground color of unselected tabs.
tab_foreground = "#a6adc8" # Subtext0

# The background color of the selected tab.
tab_selected_background = "#000000" # Base (OLED)

# The foreground color of the selected tab.
tab_selected_foreground = "#f5e0dc" # Rosewater

# The border color of the selected tab.
tab_selected_border = "#f5e0dc" # Rosewater

# The background color of the command palette.
palette_background = "#181825" # Mantle

# The foreground color of the command palette.
palette_foreground = "#cdd6f4" # Text

# The background color of the selected item in the command palette.
palette_selected_background = "#313244" # Surface0

# The foreground color of the selected item in the command palette.
palette_selected_foreground = "#f5e0dc" # Rosewater

# The text color for the title of the command palette.
palette_title_foreground = "#fab387" # Peach

# The border color of the command palette.
palette_border = "#313244" # Surface0

# Terminal ANSI Colors
# Catppuccin Mocha ANSI Mapping
# Black/Bright Black: Surface0/Surface2
# Red/Bright Red: Red/Maroon
# Green/Bright Green: Green/Teal
# Yellow/Bright Yellow: Yellow/Peach
# Blue/Bright Blue: Blue/Sapphire
# Magenta/Bright Magenta: Pink/Mauve
# Cyan/Bright Cyan: Sky/Rosewater
# White/Bright White: Subtext0/Text

ansi_black = "#313244"
ansi_red = "#f38ba8"
ansi_green = "#a6e3a1"
ansi_yellow = "#f9e2af"
ansi_blue = "#89b4fa"
ansi_magenta = "#f5c2e7"
ansi_cyan = "#89dceb"
ansi_white = "#a6adc8"

ansi_bright_black = "#585b70"
ansi_bright_red = "#eba0ac"
ansi_bright_green = "#94e2d5"
ansi_bright_yellow = "#fab387"
ansi_bright_blue = "#74c7e6"
ansi_bright_magenta = "#cba6f7"
ansi_bright_cyan = "#f5e0dc"
ansi_bright_white = "#cdd6f4"

# The color for text in the scrollbar.
scrollbar_text = "#cdd6f4"

# The background color for the scrollbar.
scrollbar_background = "#181825" # Mantle

# The background color for the scrollbar thumb.
scrollbar_thumb_background = "#313244" # Surface0

# The background color for the scrollbar thumb when hovered.
scrollbar_thumb_hover_background = "#45475a" # Surface1

# The color of the minimap text.
minimap_text = "#a6adc8"

# The background color of the minimap.
minimap_background = "#000000"

# The color of the minimap cursor.
minimap_cursor = "#f5e0dc"

# The color of the minimap viewport.
minimap_viewport = "#cba6f733" # Mauve with transparency

# The color of the minimap selection.
minimap_selection = "#a6e3a133" # Green with transparency

# The color of the minimap highlight for matches.
minimap_match_highlight = "#89b4fa33" # Blue with transparency
